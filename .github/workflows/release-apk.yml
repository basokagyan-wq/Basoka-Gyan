name: Create GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'وەشانی تاگ (Tag version - e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'ناوی ڕیلیز (Release Title)'
        required: true
        default: 'BASOKA Kurdish AI Assistant v1.0.0'
      release_notes:
        description: 'تێبینییەکانی ئەم وەشانە (Release notes)'
        required: false
        default: 'ئەم وەشانە نوێیەی BASOKA ئامادەیە بۆ داونلۆدکردن و دامەزراندن لەسەر مۆبایل.'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Keystore & Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY into .env..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar fallback..."
            curl -Lo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || true
          fi

          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          mkdir -p release-output
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_NAME="BASOKA-${TAG}.apk"
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} "release-output/${APK_NAME}" \;
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=release-output/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: ${{ github.event.inputs.release_title || steps.prepare_assets.outputs.tag_name }}
          body: |
            ## 🤖 یاریدەدەری هۆشمەندی کوردی BASOKA

            ${{ github.event.inputs.release_notes || 'فایلی فەرمی نوێترین وەشانی بەرنامەی BASOKA بۆ سیستەمی ئەندرۆید.' }}

            ---
            ### 📥 چۆنیەتی داگرتن و دامەزراندن:
            1. لە خوارەوە لە بەشی **Assets** کلیک لەسەر فایلی `${{ steps.prepare_assets.outputs.apk_name }}` بکە بۆ داگرتنی ڕاستەوخۆ بۆ ناو مۆبایلەکەت.
            2. پاش داگرتن کلیک لەسەر فایلی `.apk` بکە بۆ دامەزراندن (Install).
            3. ئەگەر مۆبایلەکەت داوای مۆڵەتی کرد، ڕێگە بدە بە (Install Unknown Apps).
            4. بەرنامەکە بکەرەوە و مۆڵەتەکانی پێویست (مایکرۆفۆن، لۆکەیشن، دەستگەیشتن) چالاک بکە.
          files: ${{ steps.prepare_assets.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

