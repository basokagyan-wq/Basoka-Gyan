name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Keystore & Environment
        run: |
          # 1. Decode debug keystore if base64 file exists or create a fallback debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare .env file for secrets gradle plugin
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # 3. Inject GEMINI_API_KEY from GitHub Secrets if configured in repository
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY secret into .env..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

          # 4. Ensure Gradle Wrapper exists & executable
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar fallback..."
            curl -Lo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || true
          fi

          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-artifacts/BASOKA-Assistant-debug.apk \;
          echo "APK created successfully:"
          ls -lh release-artifacts/BASOKA-Assistant-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASOKA-Debug-APK
          path: release-artifacts/BASOKA-Assistant-debug.apk
          retention-days: 14

      - name: Job Summary
        run: |
          echo "### 📱 APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "دەتوانیت فایلی ئەپەکە لە بەشی **Artifacts** داونلۆد بکەیت." >> $GITHUB_STEP_SUMMARY
          echo "- **ناوی فایل:** BASOKA-Assistant-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **بەستەری ڕاستەوخۆ:** لە ژێر تابلۆی 'Artifacts' کلیک لەسەر 'BASOKA-Debug-APK' بکە." >> $GITHUB_STEP_SUMMARY

