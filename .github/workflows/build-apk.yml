name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          # Decode debug keystore if base64 file exists
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare .env file for build configuration
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # Inject GEMINI_API_KEY from GitHub Secrets if provided
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY secret into .env..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/BASOKA-Assistant-debug.apk
          echo "APK created successfully:"
          ls -lh release-artifacts/BASOKA-Assistant-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASOKA-Debug-APK
          path: release-artifacts/BASOKA-Assistant-debug.apk
          retention-days: 14

      - name: Job Summary
        run: |
          echo "### 📱 APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "دەتوانیت فایلی ئەپەکە لە بەشی **Artifacts** داونلۆد بکەیت." >> $GITHUB_STEP_SUMMARY
          echo "- **ناوی فایل:** BASOKA-Assistant-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **بەستەری ڕاستەوخۆ:** لە ژێر تابلۆی 'Artifacts' کلیک لەسەر 'BASOKA-Debug-APK' بکە." >> $GITHUB_STEP_SUMMARY
